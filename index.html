<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arsenal · 军火库</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <h1>Arsenal</h1>
      <span class="brand-sub" data-i="subtitle">军火库 · 调度台账</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="status" class="on" data-i="tabStatus">状态</button>
      <button data-tab="mesh" data-i="tabMesh">Mesh</button>
      <button data-tab="match" data-i="tabMatch">Match</button>
      <button data-tab="ops" data-i="tabOps">编排</button>
    </nav>
    <div class="top-right">
      <button class="verpill" id="verpill" title="Mesh registry">
        <span class="ver" id="verlabel">v—</span><span class="vermeta" id="vermeta"></span>
      </button>
      <button class="langbtn" id="langbtn" title="中文/EN">EN</button>
    </div>
  </div>
</header>
<div class="histbanner" id="histbanner">
  <div class="wrap histbanner-in">
    <span id="histbanner-t"></span>
    <button class="btn" id="backlatest" data-i="backLatest">回到最新</button>
  </div>
</div>
<main class="wrap">
  <section id="view-status"></section>
  <section id="view-mesh" hidden></section>
  <section id="view-match" hidden></section>
  <section id="view-ops" hidden></section>
</main>
<footer class="foot">
  <div class="wrap">
    <span id="foot-src"></span>
  </div>
</footer>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <h2 data-i="dTitle">Mesh 版本历史</h2>
    <button class="btn" id="drawerclose">✕</button>
  </header>
  <div class="drawer-body" id="drawerbody"></div>
</aside>
<div class="nodepanel" id="nodepanel" aria-hidden="true">
  <div class="nodepanel-card" id="nodepanel-card"></div>
</div>
<script src="app.js"></script>
</body>
</html>
